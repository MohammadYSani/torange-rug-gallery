<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Torange Rug Gallery</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <a href="index.html" class="brand">
            <img
                src="images/logo/logo.png"
                alt="Torange Rug Gallery logo"
            >
            <span>Torange Rug Gallery</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="programs.html">Our Programs</a>
            <a href="services.html">Services</a>
            <a href="coffe-torange.html">Coffé Torange</a>
            <a href="#">About</a>
        </nav>

    </header>


    <main>

        <!-- GALLERY HERO -->

        <section class="shop-hero">

            <p class="eyebrow">
                THE COLLECTION
            </p>

            <h1>
                Shop Rugs
            </h1>

            <p>
                Browse our collection by design, origin and size.
            </p>

        </section>


        <!-- GALLERY -->

        <section class="shop-section">


            <!-- FILTERS -->

            <aside class="filters">

                <h2>
                    Filter Rugs
                </h2>


                <!-- ORIGIN -->

                <label for="origin-filter">
                    Origin
                </label>

                <select id="origin-filter">

                    <option value="all">
                        All Origins
                    </option>

                    <option value="Persia">
                        Persia
                    </option>

                    <option value="India">
                        India
                    </option>

                    <option value="Turkey">
                        Turkey
                    </option>

                </select>


                <!-- DESIGN -->

                <label for="design-filter">
                    Design
                </label>

                <select id="design-filter">

                    <option value="all">
                        All Designs
                    </option>

                    <option value="Traditional">
                        Traditional
                    </option>

                    <option value="Transitional">
                        Transitional
                    </option>

                    <option value="Modern">
                        Modern
                    </option>

                    <option value="Gabbeh">
                        Gabbeh
                    </option>

                </select>


                <!-- SIZE -->

                <label for="size-filter">
                    Size
                </label>

                <select id="size-filter">

                    <option value="all">
                        All Sizes
                    </option>

                    <option value="5' × 7'">
                        5' × 7'
                    </option>

                    <option value="6' × 9'">
                        6' × 9'
                    </option>

                    <option value="8' × 10'">
                        8' × 10'
                    </option>

                    <option value="9' × 12'">
                        9' × 12'
                    </option>

                </select>


                <!-- PRICE -->

                <label for="price-filter">
                    Price
                </label>


                <button
                    id="clear-filters"
                    class="filter-button"
                >
                    Clear Filters
                </button>

            </aside>


            <!-- RESULTS -->

            <section class="shop-results">

                <div class="shop-results-header">

                    <p id="result-count">
                        0 rugs
                    </p>

                </div>


                <div
                    id="product-grid"
                    class="product-grid"
                >
                </div>

            </section>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <img
            src="images/logo/logo.png"
            alt="Torange Rug Gallery logo"
        >

        <p>
            © 2026 Torange Rug Gallery
        </p>

    </footer>


    <!-- PRODUCT DATABASE -->

    <script src="products.js"></script>


    <!-- GALLERY LOGIC -->

    <script>

        const productGrid =
            document.getElementById("product-grid");

        const resultCount =
            document.getElementById("result-count");


        const originFilter =
            document.getElementById("origin-filter");

        const designFilter =
            document.getElementById("design-filter");

        const sizeFilter =
            document.getElementById("size-filter");


        const clearFiltersButton =
            document.getElementById("clear-filters");


        /* ========================================
           FORMAT PRICE
        ======================================== */



        /* ========================================
           RENDER PRODUCTS
        ======================================== */

        function renderProducts(productList) {

            productGrid.innerHTML = "";


            resultCount.textContent =
                `${productList.length} ${
                    productList.length === 1
                        ? "rug"
                        : "rugs"
                }`;


            /* NO RESULTS */

            if (productList.length === 0) {

                productGrid.innerHTML = `
                    <p class="no-results">
                        No rugs match these filters.
                    </p>
                `;

                return;

            }


            /* CREATE PRODUCT CARDS */

            productList.forEach(product => {

                const card =
                    document.createElement("article");


                card.className =
                    "product-card";


                /*
                    The first image in the images array
                    is used as the gallery thumbnail.
                */

                const mainImage =
                    product.images[0];


                card.innerHTML = `

                    <a
                        href="product.html?id=${product.id}"
                        class="product-image-link"
                    >

                        <img
                            src="${mainImage}"
                            alt="${product.name}"
                        >

                    </a>


                    <div class="product-card-content">


                        <p class="product-origin">
                            ${product.origin}
                        </p>


                        <h2>

                            <a href="product.html?id=${product.id}">
                                ${product.name}
                            </a>

                        </h2>


                        <p class="product-details">
                            ${product.design} · ${product.size}
                        </p>



                    </div>

                `;


                productGrid.appendChild(card);

            });

        }


        /* ========================================
           FILTER PRODUCTS
        ======================================== */

        function filterProducts() {


            const selectedOrigin =
                originFilter.value;


            const selectedDesign =
                designFilter.value;


            const selectedSize =
                sizeFilter.value;



            const filteredProducts =
                products.filter(product => {


                    /* ORIGIN */

                    const matchesOrigin =

                        selectedOrigin === "all" ||

                        product.origin === selectedOrigin;



                    /* DESIGN */

                    const matchesDesign =

                        selectedDesign === "all" ||

                        product.design === selectedDesign;



                    /* SIZE */

                    const matchesSize =

                        selectedSize === "all" ||

                        product.size === selectedSize;



                    /* PRICE */



                    return (

                        matchesOrigin &&

                        matchesDesign &&

                        matchesSize

                    );

                });


            renderProducts(filteredProducts);

        }


        /* ========================================
           FILTER EVENTS
        ======================================== */

        originFilter.addEventListener(
            "change",
            filterProducts
        );


        designFilter.addEventListener(
            "change",
            filterProducts
        );


        sizeFilter.addEventListener(
            "change",
            filterProducts
        );


        /* ========================================
           CLEAR FILTERS
        ======================================== */

        clearFiltersButton.addEventListener(
            "click",
            () => {

                originFilter.value = "all";

                designFilter.value = "all";

                sizeFilter.value = "all";


                renderProducts(products);

            }
        );


        /* ========================================
           INITIAL DISPLAY
        ======================================== */

        renderProducts(products);

    </script>

</body>

</html>
